<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background-color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .main-card {
            border-radius: 15px;
        }

        .score {
            font-size: 60px;
            font-weight: bold;
            color: green;
        }

        pre {
            white-space: pre-wrap;
            font-family: Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
        }

    </style>

</head>

<body>

    <div class="container py-5">

        <!-- Upload Card -->

        <div class="card shadow p-4 main-card">

            <h1 class="text-center mb-3">
                AI Resume Analyzer
            </h1>

            <p class="text-center text-muted">
                Upload your resume PDF and get AI feedback instantly.
            </p>

            <form 
                method="POST" 
                enctype="multipart/form-data" 
                class="mt-4"
                onsubmit="showLoading()"
            >

                {% csrf_token %}

                <input
                    type="file"
                    name="resume"
                    accept=".pdf"
                    class="form-control"
                    required
                >

                <button 
                    id="analyzeBtn"
                    type="submit" 
                    class="btn btn-success mt-3 w-100"
                >
                    Analyze Resume
                </button>

            </form>

            <!-- Loading Animation -->

            <div id="loading" class="text-center mt-4" style="display:none;">

                <div class="spinner-border text-success" role="status"></div>

                <p class="mt-2">
                    AI is analyzing the resume...
                </p>

            </div>

        </div>

        <!-- Result Section -->

        {% if feedback %}

        <div class="card shadow p-4 mt-4 main-card">

            <h2 class="mb-3">
                Resume Score
            </h2>

            <div class="score mb-3">
                {{ score }}/100
            </div>

            <!-- Progress Bar -->

            <div class="progress" style="height: 30px;">

                <div 
                    class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                    role="progressbar"
                    data-width="{{ score }}"
                >
                </div>

            </div>

            <hr>

            <h2 class="mb-3">
                AI Feedback
            </h2>

            <pre>{{ feedback }}</pre>

        </div>

        {% endif %}

    </div>

    <script>

        function showLoading() {

            document.getElementById("loading").style.display = "block";

            document.getElementById("analyzeBtn").disabled = true;

            document.getElementById("analyzeBtn").innerText = "Analyzing...";

        }

        window.onload = function () {

            let progressBar = document.querySelector(".progress-bar");

            if (progressBar) {

                let score = progressBar.getAttribute("data-width");

                progressBar.style.width = score + "%";

                progressBar.innerText = score + "%";

            }

        };

    </script>

</body>

</html>
